<header class="site-header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="site-title" aria-label="Home - {{ site.title | escape }}">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-book-open-text"></use></svg>
      <span class="site-title-en">{{ site.title | escape }}</span>
      <span class="site-title-sep" aria-hidden="true">/</span>
      <span class="site-title-zh">{{ site.description | escape }}</span>
    </a>
    <nav class="header-right" aria-label="Site">
      <a href="https://github.com/ImChong/Robot_Learning_Paper_Notebooks" class="github-link" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-github-logo"></use></svg>
        <span class="github-link-label">GitHub</span>
      </a>
      <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-translate"></use></svg>
        <span class="lang-label" data-en="中文" data-zh="English">中文</span>
      </button>
      <button id="theme-toggle" class="theme-toggle" type="button"
        data-en-aria-label="Toggle dark mode" data-zh-aria-label="切换深色 / 浅色"
        aria-label="Toggle dark mode" aria-pressed="true" title="Toggle dark mode">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-circle-half"></use></svg>
      </button>
      <button
        id="sponsor-toggle"
        class="sponsor-toggle"
        type="button"
        data-en-aria-label="Support me"
        data-zh-aria-label="赞助我"
        aria-label="Support me"
        aria-haspopup="dialog"
        aria-controls="sponsor-dialog"
        title="Support me"><svg class="icon sponsor-icon" aria-hidden="true" focusable="false"><use href="#i-coffee"></use></svg></button>
    </nav>
  </div>
</header>
