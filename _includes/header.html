<header class="site-header">
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="site-title" aria-label="Home - {{ site.title | escape }}">{% if page.layout == 'paper' %}<svg class="site-brand-mark site-brand-mark--paper" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false"><path d="M4.5 8.5C8 7 12.5 7 16 9.2C19.5 7 24 7 27.5 8.5V23.5C24 22 19.5 22 16 24.4C12.5 22 8 22 4.5 23.5V8.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M16 9.2V24.4M8.2 12.4H12.5M19.5 19.2H23.8" stroke="currentColor" stroke-opacity="0.32" stroke-width="1.5" stroke-linecap="round"/><path d="M8.6 19.3C11.8 18.6 13.6 16.5 16 15.2C18.4 13.9 20.4 12.6 23.4 11.8" stroke="var(--link)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="19.3" r="2.1" fill="var(--link)"/><circle cx="16" cy="15.2" r="2.2" fill="var(--link)"/><circle cx="23.4" cy="11.8" r="2.2" fill="var(--link)"/></svg>{% else %}<svg class="site-brand-mark site-brand-mark--library" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false"><rect x="4.8" y="7" width="6.2" height="19" rx="1.4" stroke="currentColor" stroke-width="2"/><rect x="11" y="5.5" width="6.4" height="20.5" rx="1.4" stroke="currentColor" stroke-width="2"/><path d="M7.2 11.2H8.6M7.2 21.8H8.6M13.4 10H15M13.4 21.8H15" stroke="currentColor" stroke-opacity="0.34" stroke-width="1.5" stroke-linecap="round"/><path d="M18.6 8.2L24.2 6.8L27.4 24.4L21.8 25.8L18.6 8.2Z" stroke="var(--link)" stroke-width="2" stroke-linejoin="round"/><circle cx="23" cy="16.3" r="1.25" fill="var(--link)"/></svg>{% endif %}<span class="site-title-text">{{ site.title | escape }} | {{ site.description | escape }}</span></a>
    <div class="header-right">
      <a href="https://github.com/ImChong/Robot_Learning_Paper_Notebooks" class="github-link" target="_blank" rel="noopener noreferrer" aria-label="View source on GitHub">GitHub</a>
      <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">
        <span class="lang-label" data-en="中文" data-zh="English">中文</span>
      </button>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
        <span class="icon-sun"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="8" cy="8" r="2.6"/><path d="M8 2v1.6M8 12.4V14M2 8h1.6M12.4 8H14M3.8 3.8l1.1 1.1M11.1 11.1l1.1 1.1M12.2 3.8l-1.1 1.1M4.9 11.1l-1.1 1.1"/></svg></span>
        <span class="icon-moon"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.8 9.8A5.3 5.3 0 1 1 6.2 3.2a4.3 4.3 0 0 0 6.6 6.6Z"/></svg></span>
      </button>
      <button
        id="sponsor-toggle"
        class="sponsor-toggle"
        type="button"
        data-en-aria-label="Support me"
        data-zh-aria-label="赞助我"
        aria-label="Support me"
        aria-haspopup="dialog"
        aria-controls="sponsor-dialog"
        title="Support me"><span class="sponsor-icon" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 6.2h7.6v3.9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6.2Z"/><path d="M10.6 7.3h1.3a1.7 1.7 0 0 1 0 3.4h-1.3M5.3 3.2c0 .7.6 1 .6 1.6M8.3 3.2c0 .7.6 1 .6 1.6"/></svg></span></button>
    </div>
  </div>
</header>
