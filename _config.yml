title: "Robot Learning Paper Notebooks"
description: "机器人学习论文笔记"
url: "https://imchong.github.io"
baseurl: "/Robot_Learning_Paper_Notebooks"

markdown: kramdown
kramdown:
  math_engine: null
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Include papers directory (Jekyll ignores dirs starting with _ by default)
include:
  - papers

# GitHub Pages 的构建白名单里有这两个插件；本地 Gemfile 同步列出。
# jekyll-sitemap 生成 /sitemap.xml（robots.txt 指向它），只收录真正发布的页面。
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude unnecessary files from build.
# 只有论文笔记、首页、更新记录和 assets/ 该发布；仓库里的协作说明、测试、
# 飞书技能（skills/ 下的 SKILL.md 带 front matter，不排除会被渲染成网页）、
# 截图与 README 用的演示动图都不是站点内容。
exclude:
  - README.md
  - AGENTS.md
  - progress.json
  - papers/PROGRESS.md
  - papers/DAILY_SUMMARY_LOG.md
  - papers/todos/
  - scripts/
  - tests/
  - docs/
  - media/
  - skills/
  - skills-lock.json
  - pyproject.toml
  - requirements-dev.txt
  - requirements-site.txt
  - .obsidian/
  - "*.pdf"
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CNAME

# Default front matter for paper pages
defaults:
  - scope:
      path: "papers"
      type: "pages"
    values:
      layout: "paper"

