# 首页「推荐学习路线图」的天赋树（_includes/roadmap-tree.html 渲染，assets/js/roadmap.js 画连线）。
#
# 每一系（branch）是一棵小树，一次只显示一棵：
#   mark   左侧 / 顶部标签上的编号；主线 1–9 按阅读顺序，支线用字母。
#   track  main（主线）或 side（支线）。
# 树里的节点摆在网格上：
#   row    第几层，从 1 开始，越往下越进阶；
#   col    第几列，从 1 开始，可以写 x.5 落在两列中间；同一层两个节点的 col 至少差 1，
#          最多 5 列（手机上 5 列正好占满一行）。
#   after    实线箭头：读这篇之前先读（前置）；
#   related  虚线箭头：相关拓展 / 弱依赖。
#   notes    给某条箭头加一句说明（悬浮卡片里显示），键是箭头起点的节点 id。
# 箭头只能往下一层或同一层左右指；跨两层的箭头要保证中间那层让出路（tests/test_roadmap_tree.py 会查）。
# 起点在别的系的箭头不画在树里：前置放在树上方的「前置」，指向别的系的放在树下方的「通往」。
#
# label 是节点上的短名（英文界面）；label_zh 只在中文名不同时写。全称、简介、视频时长都在悬浮卡片里，
# 按 url 从 _data/papers.json 查；节点上的 ▶（含配音讲解视频）也按 papers.json 的 video_seconds 自动加，不用手写。
# url 是站内笔记地址（不带 baseurl），也可以写 https://arxiv.org/abs/… 直接打开原文。
# 很长又没有空格的名字可以在中间放一个零宽空格（\u200B），窄屏上从那里折行。

